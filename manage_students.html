<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Manage Students</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f1f5f9;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    padding:25px 35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    font-size:38px;
}

/* CONTAINER */

.container{
    padding:30px;
}

/* CARD */

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    margin-bottom:30px;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:15px;
}

input{
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border:1px solid #2563eb;
}

/* BUTTONS */

button{
    border:none;
    border-radius:10px;
    padding:11px 18px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.add-btn{
    background:#2563eb;
    color:white;
}

.update-btn{
    background:#22c55e;
    color:white;
}

.delete-btn{
    background:#ef4444;
    color:white;
}

.logout-btn{
    background:#ef4444;
    color:white;
}

/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th{
    background:#1e3a8a;
    color:white;
    padding:15px;
    text-align:left;
}

table td{
    padding:15px;
    border-bottom:1px solid #e2e8f0;
}

table tr:hover{
    background:#f8fafc;
}

.small-input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #cbd5e1;
}

/* RESPONSIVE */

@media(max-width:768px){

.form-grid{
    grid-template-columns:1fr;
}

.header{
    flex-direction:column;
    gap:15px;
    align-items:flex-start;
}

table{
    display:block;
    overflow-x:auto;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <h1>🎓 Manage Students</h1>

    <button class="logout-btn"
            onclick="logout()">

        Logout

    </button>

</div>

<!-- CONTAINER -->

<div class="container">

    <!-- ADD STUDENT -->

    <div class="card">

        <h2>Add Student</h2>

        <br>

        <div class="form-grid">

            <input type="text"
                   id="name"
                   placeholder="Enter Student Name">

            <input type="email"
                   id="email"
                   placeholder="Enter Student Email">

            <input type="password"
                   id="password"
                   placeholder="Enter Password">

            <input type="text"
                   id="department"
                   placeholder="Enter Department">

            <input type="number"
                   id="year"
                   placeholder="Enter Year">

            <button class="add-btn"
                    onclick="addStudent()">

                Add Student

            </button>

        </div>

    </div>

    <!-- STUDENT LIST -->

    <div class="card">

        <h2>Student List</h2>

        <table>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>department</th>
                <th>year</th>
                <th>Role</th>
                <th>Actions</th>

            </tr>

            <tbody id="studentTable"></tbody>

        </table>

    </div>

</div>

<script>

/* CHECK LOGIN */

let user = JSON.parse(localStorage.getItem("user"));

if(!user){

    window.location.href = "login.html";

}

if(user.role !== "ADMIN"){

    alert("Access Denied");

    window.location.href = "login.html";

}

/* LOGOUT */

function logout(){

    localStorage.clear();

    window.location.href = "login.html";

}

/* LOAD STUDENTS */

loadStudents();

function loadStudents(){

fetch("http://localhost:8080/api/auth/users")

.then(res => res.json())

.then(data => {

    let table =
    document.getElementById("studentTable");

    table.innerHTML = "";

    data.forEach(user => {

        if(user.role === "STUDENT"){

            table.innerHTML += `

<tr>

    <td>${user.user_id}</td>

    <td>
        <input type="text"
               class="small-input"
               id="name${user.user_id}"
               value="${user.name || ''}">
    </td>

    <td>
        <input type="text"
               class="small-input"
               id="email${user.user_id}"
               value="${user.email}">
    </td>

    <td>
        <input type="text"
               class="small-input"
               id="department${user.user_id}"
               value="${user.department || ''}">
    </td>

    <td>
        <input type="number"
               class="small-input"
               id="year${user.user_id}"
               value="${user.year || ''}">
    </td>

    <td>
        <input type="text"
               class="small-input"
               value="STUDENT"
               readonly>
    </td>

    <td>

        <button class="update-btn"
                onclick="updateStudent(${user.user_id})">

            Update

        </button>

        <button class="delete-btn"
                onclick="deleteStudent(${user.user_id})">

            Delete

        </button>

    </td>

</tr>



            

            `;

        }

    });

});

}

/* ADD STUDENT */

function addStudent(){

let name =
document.getElementById("name").value;

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

let department =
document.getElementById("department").value;

let year =
document.getElementById("year").value;

fetch("http://localhost:8080/api/auth/signup",{

    method:"POST",

    headers:{
        "Content-Type":"application/json"
    },

    body:JSON.stringify({

        name:name,
        email:email,
        password:password,
        department:department,
        year:year,
        role:"STUDENT"

    })

})

.then(res => res.json())

.then(data => {

    alert("Student Added Successfully");

    document.getElementById("name").value = "";

    document.getElementById("email").value = "";

    document.getElementById("password").value = "";

    document.getElementById("department").value = "";

    document.getElementById("year").value = "";

    loadStudents();

});

}

/* UPDATE STUDENT */

function updateStudent(id){

let updatedName =
document.getElementById("name"+id).value;

let updatedEmail =
document.getElementById("email"+id).value;

let updatedDepartment =
document.getElementById("department"+id).value;

let updatedYear =
document.getElementById("year"+id).value;

fetch("http://localhost:8080/api/auth/update/" + id, {

    method:"PUT",

    headers:{
        "Content-Type":"application/json"
    },

    body:JSON.stringify({

        name:updatedName,
        email:updatedEmail,
        department:updatedDepartment,
        year:updatedYear,
        role:"STUDENT"

    })

})

.then(res => res.json())

.then(data => {

    alert("Student Updated Successfully");

    loadStudents();

});

}

/* DELETE STUDENT */

function deleteStudent(id){

fetch("http://localhost:8080/api/auth/users/" + id,{

    method:"DELETE"

})

.then(() => {

    alert("Student Deleted");

    loadStudents();

});

}

</script>

</body>
</html>
