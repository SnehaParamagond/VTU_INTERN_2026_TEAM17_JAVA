<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    display:flex;
    background:#f1f5f9;
}

/* SIDEBAR */

.sidebar{
    width:240px;
    height:100vh;
    background:linear-gradient(180deg,#0f172a,#1e293b);
    color:white;
    padding:25px;
    position:fixed;
}

.sidebar h2{
    margin-bottom:40px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:14px;
    margin:12px 0;
    border-radius:10px;
    transition:0.3s;
}

.sidebar a:hover{
    background:#38bdf8;
}

/* MAIN */

.main{
    margin-left:240px;
    padding:30px;
    width:100%;
}

/* TOP */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.logout-btn{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#ef4444;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

/* CARDS */

.cards{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.card{
    background:white;
    width:220px;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.card h3{
    color:#64748b;
    margin-bottom:10px;
}

.card p{
    font-size:30px;
    font-weight:bold;
    color:#0f172a;
}

/* FORM */

.form-box{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    margin-bottom:30px;
}

.form-box h2{
    margin-bottom:20px;
}

input,
select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

/* BUTTON */

.btn{
    padding:12px 18px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th{
    background:#1e3a8a;
    color:white;
    padding:14px;
    text-align:left;
}

table td{
    padding:14px;
    border-bottom:1px solid #ddd;
    background:white;
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h2>👩‍🏫 Teacher</h2>

    <a href="#">🏠 Dashboard</a>

    <a href="#attendanceSection">
        📅 Take Attendance
    </a>

    <a href="#marksSection">
        📝 Enter Marks
    </a>

</div>

<!-- MAIN -->

<div class="main">

    <!-- TOPBAR -->

    <div class="topbar">

        <h1>Teacher Dashboard</h1>

        <button class="logout-btn"
                onclick="logout()">

            Logout

        </button>

    </div>

    <!-- CARDS -->

    <div class="cards">

        <div class="card">

            <h3>Total Students</h3>

            <p id="studentCount">0</p>

        </div>

        <div class="card">

            <h3>Attendance</h3>

            <p>Manage</p>

        </div>

        <div class="card">

            <h3>Marks</h3>

            <p>Update</p>

        </div>

    </div>

    <!-- ATTENDANCE -->

    <div class="form-box"
         id="attendanceSection">

        <h2>Take Attendance</h2>

        <input type="number"
               id="attendanceStudentId"
               placeholder="Enter Student ID">

        <input type="date"
               id="attendanceDate">

        <select id="attendanceStatus">

            <option value="PRESENT">
                PRESENT
            </option>

            <option value="ABSENT">
                ABSENT
            </option>

        </select>

        <button class="btn"
                onclick="addAttendance()">

            Save Attendance

        </button>

    </div>

    <!-- MARKS -->

    <div class="form-box"
         id="marksSection">

        <h2>Enter Marks</h2>

        <input type="number"
               id="marksStudentId"
               placeholder="Enter Student ID">

        <input type="text"
               id="subject"
               placeholder="Enter Subject">

        <input type="number"
               id="marks"
               placeholder="Enter Marks">

        <button class="btn"
                onclick="addMarks()">

            Save Marks

        </button>

    </div>

    <!-- ATTENDANCE TABLE -->

    <div class="form-box">

        <h2>Attendance Records</h2>

        <table>

            <tr>

                <th>ID</th>

                <th>Student ID</th>

                <th>Date</th>

                <th>Status</th>
                <th>Action</th>

            </tr>

            <tbody id="attendanceTable"></tbody>

        </table>

    </div>

    <!-- MARKS TABLE -->

    <div class="form-box">

        <h2>Marks Records</h2>

        <table>

            <tr>

                <th>ID</th>

                <th>Student ID</th>

                <th>Subject</th>

                <th>Marks</th>

            </tr>

            <tbody id="marksTable"></tbody>

        </table>

    </div>

</div>

<script>

let user = JSON.parse(localStorage.getItem("user"));

if(!user){

    window.location.href = "login.html";

}

if(user.role !== "TEACHER"){

    alert("Access Denied");

    window.location.href = "login.html";

}

/* LOAD STUDENT COUNT */

fetch("http://localhost:8080/api/auth/users")

.then(res => res.json())

.then(data => {

    let count = 0;

    data.forEach(user => {

        if(user.role === "STUDENT"){

            count++;

        }

    });

    document.getElementById("studentCount").innerText = count;

});

/* ADD ATTENDANCE */

function addAttendance(){

let studentId =
document.getElementById("attendanceStudentId").value;

let date =
document.getElementById("attendanceDate").value;

let status =
document.getElementById("attendanceStatus").value;

fetch("http://localhost:8080/api/attendance",{

    method:"POST",

    headers:{
        "Content-Type":"application/json"
    },

    body:JSON.stringify({

        studentId:studentId,
        date:date,
        status:status

    })

})

.then(res => res.json())

.then(data => {

    alert("Attendance Added");

    loadAttendance();

});

}

/* ADD MARKS */

function addMarks(){

let studentId =
document.getElementById("marksStudentId").value;

let subject =
document.getElementById("subject").value;

let marks =
document.getElementById("marks").value;

fetch("http://localhost:8080/api/marks",{

    method:"POST",

    headers:{
        "Content-Type":"application/json"
    },

    body:JSON.stringify({

        studentId:studentId,
        subject:subject,
        marks:marks

    })

})

.then(res => res.json())

.then(data => {

    alert("Marks Added");

    loadMarks();

});

}

/* LOAD ATTENDANCE */

function loadAttendance(){

fetch("http://localhost:8080/api/attendance")

.then(res => res.json())

.then(data => {

    let table =
    document.getElementById("attendanceTable");

    table.innerHTML = "";

    data.forEach(a => {

        table.innerHTML += `

<tr>

    <td>${a.attendanceId}</td>

    <td>${a.studentId}</td>

    <td>

        <input type="date"
               id="date${a.attendanceId}"
               value="${a.date}">

    </td>

    <td>

        <select id="status${a.attendanceId}">

            <option value="PRESENT"
            ${a.status === "PRESENT" ? "selected" : ""}>

            PRESENT

            </option>

            <option value="ABSENT"
            ${a.status === "ABSENT" ? "selected" : ""}>

            ABSENT

            </option>

        </select>

    </td>

    <td>

        <button class="btn"
        onclick="updateAttendance(${a.attendanceId},
                                  ${a.studentId})">

        Edit

        </button>

    </td>

</tr>

`;

    });

});

}

function updateAttendance(id,studentId){

let updatedDate =
document.getElementById("date"+id).value;

let updatedStatus =
document.getElementById("status"+id).value;

fetch("http://localhost:8080/api/attendance/" + id,{

    method:"PUT",

    headers:{
        "Content-Type":"application/json"
    },

    body:JSON.stringify({

        studentId:studentId,
        date:updatedDate,
        status:updatedStatus

    })

})

.then(res => res.json())

.then(data => {

    alert("Attendance Updated");

    loadAttendance();

});

}

/* LOAD MARKS */

function loadMarks(){

fetch("http://localhost:8080/api/marks")

.then(res => res.json())

.then(data => {

    let table =
    document.getElementById("marksTable");

    table.innerHTML = "";

    data.forEach(m => {

        table.innerHTML += `

        <tr>

            <td>${m.marksId}</td>

            <td>${m.studentId}</td>

            <td>${m.subject}</td>

            <td>${m.marks}</td>

        </tr>

        `;

    });

});

}

/* INITIAL LOAD */

loadAttendance();

loadMarks();

/* LOGOUT */

function logout(){

    localStorage.clear();

    window.location.href = "login.html";

}
  


</script>

</body>
</html>
