<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #1e1e2f;
            color: white;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #111827;
            position: fixed;
            padding: 20px;
        }

        .sidebar h2 {
            color: #00d4ff;
        }

        .sidebar a {
            display: block;
            color: white;
            margin: 15px 0;
            text-decoration: none;
        }

        .sidebar a:hover {
            color: #00d4ff;
        }

        /* MAIN */
        .main {
            margin-left: 240px;
            padding: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        input, select {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 2px;
        }

        /* BUTTON COLORS */
        .save-btn {
            background: #00d4ff;
            color: black;
        }

        .edit-btn {
            background: orange;
            color: white;
        }

        .delete-btn {
            background: red;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        /* TABLE */
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        th {
            background: #111827;
        }

        tr {
            background: #2a2a40;
        }

    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>EduTrack</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="student.html">Students</a>
    <a href="attendance.html">Attendance</a>
    <a href="#">Logout</a>
</div>

<!-- MAIN -->
<div class="main">

    <h1>Attendance</h1>

    <input type="number" id="studentId" placeholder="Student ID">
    <input type="date" id="date">

    <select id="status">
        <option value="PRESENT">PRESENT</option>
        <option value="ABSENT">ABSENT</option>
    </select>

    <button class="save-btn" onclick="saveAttendance()">Save</button>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Student ID</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>
    </table>

</div>

<script>

let editId = null;

// LOAD DATA
function loadAttendance() {
    fetch("http://localhost:8080/api/attendance")
    .then(res => res.json())
    .then(data => {

        let rows = "";
        data.forEach(a => {
            rows += `
            <tr>
                <td>${a.attendanceId}</td>
                <td>${a.studentId}</td>
                <td>${a.date}</td>
                <td>${a.status}</td>
                <td>
                    <button class="edit-btn" onclick="edit(${a.attendanceId}, ${a.studentId}, '${a.date}', '${a.status}')">Edit</button>
                    <button class="delete-btn" onclick="deleteAtt(${a.attendanceId})">Delete</button>
                </td>
            </tr>`;
        });

        document.getElementById("tableBody").innerHTML = rows;
    });
}

// SAVE / UPDATE
function saveAttendance() {
    let studentId = document.getElementById("studentId").value;
    let date = document.getElementById("date").value;
    let status = document.getElementById("status").value;

    if (!studentId || !date) {
        alert("Fill all fields");
        return;
    }

    let url = editId 
        ? "http://localhost:8080/api/attendance/" + editId
        : "http://localhost:8080/api/attendance";

    let method = editId ? "PUT" : "POST";

    fetch(url, {
        method: method,
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            attendanceId: editId,
            studentId: parseInt(studentId),
            date: date,
            status: status
        })
    })
    .then(() => {
        alert(editId ? "Updated" : "Saved");
        editId = null;

        // clear form
        document.getElementById("studentId").value = "";
        document.getElementById("date").value = "";
        document.getElementById("status").value = "PRESENT";

        loadAttendance();
    });
}

// DELETE
function deleteAtt(id) {
    fetch("http://localhost:8080/api/attendance/" + id, {
        method: "DELETE"
    })
    .then(() => {
        alert("Deleted");
        loadAttendance();
    });
}

// EDIT
function edit(id, studentId, date, status) {
    editId = id;

    document.getElementById("studentId").value = studentId;
    document.getElementById("date").value = date;
    document.getElementById("status").value = status;
}

// LOAD ON START
loadAttendance();

</script>

</body>
</html>
