<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack Login</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center/cover;
  overflow:hidden;
}

/* DARK OVERLAY */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.65);
}

/* LOGIN BOX */
.login-box{
  position:relative;
  width:350px;
  padding:35px;
  border-radius:18px;
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  text-align:center;
  animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.login-box h2{
  margin-bottom:8px;
  color:#0f172a;
}

.login-box p{
  color:gray;
  margin-bottom:20px;
}

/* INPUTS */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
  outline:none;
  transition:0.3s;
}

input:focus{
  border-color:#38bdf8;
  box-shadow:0 0 5px rgba(56,189,248,0.5);
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:linear-gradient(to right,#0ea5e9,#38bdf8);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.03);
}

button:disabled{
  background:gray;
  cursor:not-allowed;
}

/* SMALL LINKS */
.small{
  margin-top:15px;
  font-size:14px;
}

.small a{
  color:#0ea5e9;
  text-decoration:none;
  font-weight:bold;
}

.small a:hover{
  text-decoration:underline;
}

/* ERROR */
.error{
  margin-top:10px;
  color:red;
  font-size:14px;
}

</style>
</head>

<body>

<div class="login-box">

  <h2>EduTrack</h2>
  <p>Welcome Back 👋</p>

  <input type="email" id="email" placeholder="Enter Email">

  <input type="password" id="password" placeholder="Enter Password">

  <div class="error" id="errorMsg"></div>

  <button id="loginBtn" onclick="login()">
    Login
  </button>

  <div class="small">
    Don't have an account?
    <a href="signup.html">Sign Up</a>
  </div>

  <div class="small">
    <a href="index.html">Go to Home Page</a>
  </div>

</div>

<script>

/* ENTER KEY SUPPORT */
document.addEventListener("keypress", function(e){

    if(e.key === "Enter"){
        login();
    }

});

/* LOGIN FUNCTION */
function login(){

    let email =
    document.getElementById("email").value.trim();

    let password =
    document.getElementById("password").value.trim();

    let errorMsg =
    document.getElementById("errorMsg");

    let btn =
    document.getElementById("loginBtn");

    errorMsg.innerText = "";

    /* VALIDATION */
    if(email === "" || password === ""){

        errorMsg.innerText =
        "Please enter all fields";

        return;
    }

    btn.innerText = "Logging in...";
    btn.disabled = true;

    fetch("http://localhost:8080/api/auth/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            email:email,
            password:password
        })

    })

    .then(res => {

        if(!res.ok){
            throw new Error("Invalid credentials");
        }

        return res.json();

    })

    .then(data => {

        console.log(data);

        /* SAVE USER */
        localStorage.setItem(
            "user",
            JSON.stringify(data)
        );

        /* SAVE STUDENT ID */
        localStorage.setItem(
            "studentId",
            data.id
        );

        /* ROLE */
        let role = data.role
        ? data.role.toUpperCase()
        : "";

        /* REDIRECT */
        if(role === "ADMIN"){

            window.location.href =
            "admin.html";

        }

        else if(role === "TEACHER"){

            window.location.href =
            "teacher.html";

        }

        else if(role === "STUDENT"){

            window.location.href =
            "student_dashboard.html";

        }

        else{

            errorMsg.innerText =
            "Invalid role found";

        }

    })

    .catch(err => {

        console.log(err);

        errorMsg.innerText =
        "Login failed. Check backend or credentials.";

    })

    .finally(() => {

        btn.innerText = "Login";
        btn.disabled = false;

    });

}

</script>

</body>
</html>
